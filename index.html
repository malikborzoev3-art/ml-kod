            py.runPython(['import json', 'def _flakes(src):', '    import pyflakes.api', '    out = []', '    class R:', '        def unexpectedError(self, fn, msg): pass', '        def syntaxError(self, fn, msg, ln, col, text): pass', '        def flake(self, m): out.append([m.lineno, m.col, type(m).__name__, m.message % m.message_args])', '    pyflakes.api.check(src, "<code>", R())', '    return json.dumps(out)'].join('\n'));
            flOk = true;
          }
          py.globals.set('_fsrc', d.src);
          r = py.runPython('_flakes(_fsrc)');
        } catch (e) { r = JSON.stringify({ fail: String(e.message || e).split('\n').filter(Boolean).pop() || 'ошибка' }); }
        send(d.id, { done: 1, r }); return;
      }
      if (d.t === 'fmt') {
        let r;
        try {
          if (!fmtOk) {
            // одна общая установка: если «Формат» нажали, пока Black уже ставится в фоне, второй вызов просто ждёт первый
            if (!fmtP) fmtP = (async () => { await py.loadPackage('micropip'); await py.runPythonAsync('import micropip\nawait micropip.install("black")'); fmtOk = true; })().finally(() => { fmtP = null; });
            await fmtP;
          }
          py.globals.set('_fsrc', d.src);
          r = JSON.stringify({ ok: py.runPython('import black\nblack.format_str(_fsrc, mode=black.Mode(line_length=88))') });
        } catch (e) { const m = String(e.message || e).split('\n').filter(Boolean).pop() || ''; r = JSON.stringify(/InvalidInput|Cannot parse/.test(m) ? { syntax: m } : { fail: m }); }
        send(d.id, { done: 1, r }); return;
      }
      proxy = d.proxy || ''; pOrigin = d.origin || '';
      let buf = '';
      const live = d.t === 'run', emit = (s, e) => { if (!s) return; if (live) send(d.id, { o: s, e: e }); else buf += s; };
      py.setStdout({ write: b => { emit(dO.decode(b, { stream: true }), 0); return b.length; } });
      py.setStderr({ write: b => { emit(dE.decode(b, { stream: true }), 1); return b.length; } });
      const q = (d.stdin || '').split('\n'); if (q.length && q[q.length - 1] === '') q.pop();
      py.setStdin({ stdin: () => { if (q.length) return q.shift() + '\n'; if (d.inter && d.sync) {
          // настоящий блокирующий input(): ждём ответ от сервис-воркера, пока пользователь печатает
          const key = (d.sid || '') + '-' + d.id + '-' + (++nIn); send(d.id, { need: 1, key: key });
          for (let n = 0, bad = 0; n < 100000 && bad < 50; n++) {
            try { const x = new XMLHttpRequest(); x.open('GET', d.sync + '__ml_wait?k=' + encodeURIComponent(key), false); x.send(); if (x.status === 200) return x.responseText + '\n'; if (x.status !== 204) bad++; } catch (_) { bad++; }
          }
          return undefined;
        }
        if (d.inter) { send(d.id, { need: 1 }); throw new Error('NEED_INPUT'); } return undefined; } });
      for (const f of written) { try { py.FS.unlink(ROOT + '/' + f); } catch (_) {} }
      written = [];
      for (const f of d.files || []) {
        const dir = f.p.split('/').slice(0, -1).join('/');
        if (dir) { try { py.FS.mkdirTree(ROOT + '/' + dir); } catch (_) {} }
        py.FS.writeFile(ROOT + '/' + f.p, f.c); written.push(f.p);
      }
      py.runPython('import sys, os, random\nos.chdir("' + ROOT + '")\nfor _m in [m for m, v in sys.modules.items() if str(getattr(v, "__file__", "")).startswith("' + ROOT + '/")]: del sys.modules[_m]\nrandom.seed(' + ((d.seed | 0) || 1) + ')');
      if (d.t === 'debug') { send(d.id, { done: 1, r: dbg(d.src) }); return; }
      try { await py.loadPackagesFromImports(d.src, { messageCallback: () => {}, errorCallback: () => {} }); } catch (_) {}
      // seaborn и plotly нет в наборе Pyodide: ставим из PyPI через micropip (один раз за сеанс, нужен интернет). pandas.plot() и seaborn тянут matplotlib
      const imp = n => new RegExp('^[ \\t]*(?:import|from)[ \\t]+' + n + '\\b', 'm').test(d.src), quiet = { messageCallback: () => {}, errorCallback: () => {} };
      const wantSb = imp('seaborn'), wantPl = imp('plotly');
      if (wantSb || (imp('pandas') && /\.(?:plot|hist|boxplot)\b/.test(d.src))) { try { await py.loadPackage(['numpy', 'pandas', 'matplotlib'], quiet); } catch (_) {} }
      if ((wantSb && !sbOk) || (wantPl && !plOk)) {
        try {
          if (!mpOk) { await py.loadPackage('micropip', quiet); mpOk = true; }
          if (wantSb && !sbOk) { if (live) send(d.id, { st: '⏳ Устанавливаю seaborn (один раз за сеанс)…\n' }); await py.runPythonAsync('import micropip\nawait micropip.install("seaborn")'); sbOk = true; }
          if (wantPl && !plOk) { if (live) send(d.id, { st: '⏳ Устанавливаю plotly (один раз за сеанс, около 15 МБ)…\n' }); await py.runPythonAsync('import micropip\nawait micropip.install("plotly==5.24.1")'); py.runPython(PLPATCH); plOk = true; }
        } catch (e) { emit('Не удалось установить библиотеку (нужен интернет): ' + (String(e.message || e).split('\n').filter(Boolean).pop() || '') + '\n', 1); }
        if (live) send(d.id, { st: '' });
      }
      // автоустановка недостающих модулей из PyPI (после seaborn/plotly, чтобы те ставились со своими настройками)
      const instFail = {};
      try {
        if (!missOk) { py.runPython(MISS); missOk = true; }
        py.globals.set('_asrc', d.src);
        const miss = JSON.parse(py.runPython('_missing(_asrc)')).filter(n => !NOPIP.has(n) && /^[A-Za-z_]\w*$/.test(n)).slice(0, 8);
        if (miss.length) {
          if (!mpOk) { await py.loadPackage('micropip', quiet); mpOk = true; }
          for (const n of miss) {
            const pk = ALIAS[n] || n;
            if (live) send(d.id, { st: '⏳ Устанавливаю ' + pk + ' из PyPI…\n' });
            try { await py.runPythonAsync('import micropip\nawait micropip.install(' + JSON.stringify(pk) + ')'); }
            catch (e) {
              const m = String(e.message || e);
              instFail[n] = 'Не удалось установить «' + pk + '»: ' + (/pure Python 3 wheel/i.test(m) ? 'пакет содержит нативный код, в браузере он не работает' : /find a pure|No matching|Can.t find|not found|404/i.test(m) ? 'такого пакета нет на PyPI' : 'нет доступа к PyPI (проверьте интернет)') + '\n';
            }
          }
          if (live) send(d.id, { st: '' });
        }
      } catch (_) {}
      // библиотеки, чьё имя указано строкой (__import__("scipy"), importlib.import_module), тоже подгружаем
      for (const [k, v] of Object.entries({ scipy: 'scipy', sympy: 'sympy', PIL: 'pillow', sklearn: 'scikit-learn', bs4: 'beautifulsoup4', cv2: 'opencv-python', yaml: 'pyyaml', lxml: 'lxml', networkx: 'networkx', statsmodels: 'statsmodels', mpmath: 'mpmath', regex: 'regex' })) {
        if (new RegExp('[\'"]' + k + '[\'"]').test(d.src)) { try { await py.loadPackage(v, { messageCallback: () => {}, errorCallback: () => {} }); } catch (_) {} }
      }
      if (/\b(requests|urllib)\b/.test(d.src)) { try { await py.loadPackage(['pyodide-http', 'requests']); py.runPython('import pyodide_http\npyodide_http.patch_all()'); } catch (_) {} }
      let err = null; const g = py.globals.get('dict')(); g.set('__name__', '__main__');
      try { await py.runPythonAsync(d.src, { globals: g }); } catch (e) { err = String(e.message || e); }
      // причину неудачной установки показываем, только если программа действительно упала из-за этого модуля (необязательные импорты в try/except не шумят)
      if (err) for (const n in instFail) if (err.indexOf("No module named '" + n) >= 0) emit(instFail[n], 1);
      g.destroy();
      let im = [], pf = []; if (live || d.t === 'test') { try { im = JSON.parse(figs()); } catch (_) {} if (plOk) { try { pf = JSON.parse(py.runPython('_pfigs()')); } catch (_) {} } }
      send(d.id, { done: 1, err: err, buf: buf, im: im, pf: pf });
    } catch (e) {
      if (d.init) postMessage({ fatal: String(e) }); else send(d.id, { done: 1, err: String(e && e.message || e), buf: '', im: [] });
    }
  };
